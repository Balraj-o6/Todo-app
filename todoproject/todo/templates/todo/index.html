<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Todo App</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* General Resets and Body Styling */
        :root {
            --primary-color: #6a5acd; /* A nice slate blue/purple */
            --background-color: #f4f7f9;
            --container-bg: #ffffff;
            --text-color: #333;
            --border-color: #e0e0e0;
            --completed-color: #999;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 50px;
        }

        /* Main App Container */
        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--container-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
            margin: 20px;
        }

        /* Header Section */
        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        header h1 {
            color: var(--primary-color);
            font-weight: 700;
        }
        
        header p {
            color: #888;
            font-size: 0.9em;
        }

        /* Task Input Form */
        .task-form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .task-form input[type="text"] {
            flex-grow: 1;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1em;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.3s;
        }

        .task-form input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .task-form button {
            padding: 12px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .task-form button:hover {
            background-color: #5948b1;
        }

        /* Task List Styling */
        .task-list {
            list-style: none;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5px;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s;
        }
        
        .task-item:last-child {
            border-bottom: none;
        }
        
        .task-item .task-title {
            flex-grow: 1;
            margin-right: 15px;
        }

        /* Styling for Completed Tasks */
        .task-item.completed .task-title {
            text-decoration: line-through;
            color: var(--completed-color);
            opacity: 0.7;
        }
        
        .task-actions {
            display: flex;
            gap: 10px;
        }
        
        .task-actions a {
            text-decoration: none;
            color: #777;
            font-size: 1.1em;
            padding: 5px;
            transition: color 0.3s, transform 0.2s;
        }

        .task-actions .btn-toggle:hover {
            color: var(--success-color);
            transform: scale(1.2);
        }
        
        .task-actions .btn-delete:hover {
            color: var(--danger-color);
            transform: scale(1.2);
        }
        
        /* Message for when no tasks are present */
        .empty-message {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>My Todo List</h1>
            <p>Saturday, 27 September 2025</p>
        </header>

        <form class="task-form" method="POST" action="{% url 'add_task' %}">
            {% csrf_token %}
            <input type="text" name="title" placeholder="Add a new task..." required autocomplete="off">
            <button type="submit"><i class="fas fa-plus"></i> Add Task</button>
        </form>

        <ul class="task-list">
            {% for task in tasks %}
                <li class="task-item {% if task.completed %}completed{% endif %}">
                    <span class="task-title">{{ task.title }}</span>
                    <div class="task-actions">
                        <a href="{% url 'toggle_task' task.id %}" class="btn-toggle" title="Toggle Status">
                            {% if task.completed %}
                                <i class="fas fa-undo"></i> {% else %}
                                <i class="fas fa-check"></i> {% endif %}
                        </a>
                        <a href="{% url 'delete_task' task.id %}" class="btn-delete" title="Delete Task">
                            <i class="fas fa-trash"></i>
                        </a>
                    </div>
                </li>
            {% empty %}
                <li class="empty-message">You have no tasks yet. Great job!</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
